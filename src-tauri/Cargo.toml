[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-fs = "2.7.1"
iroh = "1.4.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tauri-plugin-dialog = "2.8.4"
base64 = "0.23.1"
uuid = { version = "1.29.2", features = ["v4"] }
tracing = "0.1.44"
iroh-mdns-address-lookup = "0.6.1"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
